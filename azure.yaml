# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: agent-assist
services:
  agent-assist-skills:
    host: azure.ai.agent
    project: src/agent-assist
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: agent-assist.dll
      dependencyResolution: remote_build
    kind: hosted
    name: agent-assist-skills
    displayName: Agent Assist (skills)
    description: MAPS conversational front door whose playbooks are Agent Skills (SKILL.md) loaded on demand instead of a long prompt.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
    metadata:
      tags: [AI Agent Hosting, Responses Protocol, Agent Framework, Agent Skills, MAPS]
